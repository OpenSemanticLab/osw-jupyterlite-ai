# Build the JupyterLite site and publish it as a release artifact.
#
# dist/ is 62 MB of generated assets and is deliberately not in git, so installations that
# cannot run this build - the MediaWiki image, a wiki on someone else's host - need a
# tarball to fetch. This produces it, with a checksum, from a tagged commit.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run it by hand from the Actions tab against any ref.

name: release-dist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      osw_ref:
        description: >-
          Ref of OpenSemanticLab/osw-python to build the osw wheel from. Must contain the
          dask fix; see OSW_LOCAL_VERSION below.
        default: main
      tag:
        description: "Release tag to create or update. Defaults to the pushed tag."
        default: ""

permissions:
  contents: write

env:
  # The osw wheel is built from source rather than taken from PyPI until a release carries
  # the dask fix: osw imports dask unconditionally, which has no pure-python wheel and so
  # cannot install under Pyodide at all. Point this at a ref that has it.
  OSW_REPO: OpenSemanticLab/osw-python
  OSW_REF: ${{ github.event.inputs.osw_ref || 'main' }}
  # PEP 440 local segment stamped onto that wheel. It sorts above the plain version, so a
  # resolver cannot silently prefer the unpatched PyPI copy - which is exactly what
  # happened before this existed. Set it empty once a release carries the fix, and delete
  # the local-build step with it.
  OSW_LOCAL_VERSION: pyodide1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out osw-python
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OSW_REPO }}
          ref: ${{ env.OSW_REF }}
          path: .osw-src

      - name: Fail early if the dask fix is missing
        # Without this the build succeeds and ships an osw that cannot import in the
        # browser - a failure that only shows up in someone's first notebook cell. Checking
        # the marker here costs a second and turns it into a red build.
        run: |
          if grep -qE '^import dask' .osw-src/src/osw/utils/util.py; then
            echo "::error::$OSW_REPO@$OSW_REF still imports dask at module level."
            echo "::error::osw cannot install under Pyodide with that. Point osw_ref at a"
            echo "::error::branch carrying the dask fix (feat/pyodide-support)."
            exit 1
          fi
          echo "dask import is not unconditional - ok"

      - name: Build the site
        env:
          OSW_SRC: ${{ github.workspace }}/.osw-src
        run: scripts/build.sh

      - name: Check the built index is the one we meant to ship
        # Two regressions have reached a deployed site this way, so both are asserted
        # rather than assumed: the unpatched osw winning the version tie, and the
        # battery/view stack resolving but not being vendored.
        run: |
          fail=0
          ls _output/pypi/osw-*+${OSW_LOCAL_VERSION}-*.whl >/dev/null 2>&1 || {
            echo "::error::no osw wheel carrying +${OSW_LOCAL_VERSION}; the PyPI copy won"
            fail=1
          }
          for pkg in panel panelini opensemantic_batteries; do
            ls _output/pypi/${pkg}-*.whl >/dev/null 2>&1 || {
              echo "::error::$pkg is not in the site index"; fail=1; }
          done
          echo "wheels: $(ls _output/pypi/*.whl | wc -l)"
          exit $fail

      - name: Package
        id: package
        run: |
          # -m is not available on create, so the mtimes are normalised here instead:
          # JupyterLab stamps artifacts 1985-10-26, and with no Cache-Control that gives
          # browsers years of heuristic freshness. Consumers should still extract with
          # `tar -xzm`; this makes the archive sane either way.
          find _output -exec touch {} +
          tar -czf jupyterlite-dist.tar.gz -C _output .
          sha256sum jupyterlite-dist.tar.gz | tee jupyterlite-dist.tar.gz.sha256
          {
            echo "sha256=$(cut -d' ' -f1 < jupyterlite-dist.tar.gz.sha256)"
            echo "size=$(du -h jupyterlite-dist.tar.gz | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-dist
          path: |
            jupyterlite-dist.tar.gz
            jupyterlite-dist.tar.gz.sha256
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The consumer is a Dockerfile ARG pair, so the checksum belongs in the body
          # where someone can copy it without downloading the asset first.
          notes=$(cat <<EOF
          Built from \`${{ github.sha }}\` with osw-python \`${OSW_REF}\`.

          | | |
          | --- | --- |
          | size | ${{ steps.package.outputs.size }} |
          | sha256 | \`${{ steps.package.outputs.sha256 }}\` |

          Install into a MediaWiki JupyterLite extension:

          \`\`\`bash
          curl -fL -o /tmp/jl.tar.gz <this asset url>
          echo "${{ steps.package.outputs.sha256 }}  /tmp/jl.tar.gz" | sha256sum -c -
          mkdir -p dist && tar -xzmf /tmp/jl.tar.gz -C dist
          \`\`\`

          \`-m\` matters: it restamps mtimes on extraction. JupyterLab's reproducible
          1985 timestamps otherwise give browsers years of heuristic freshness and a
          redeploy goes unnoticed.
          EOF
          )
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" jupyterlite-dist.tar.gz jupyterlite-dist.tar.gz.sha256 --clobber \
            || gh release create "$TAG" jupyterlite-dist.tar.gz jupyterlite-dist.tar.gz.sha256 \
                 --title "$TAG" --notes "$notes"
