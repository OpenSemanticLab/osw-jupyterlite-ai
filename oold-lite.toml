# The OSW flavour of oold-jupyterlite-ai.
#
# Paths resolve against this file. Anything not set here comes from the base package, so
# this lists only what OSW actually changes.

[site]
contents = ["contents"]
apps = ["lab"]
# Ours rather than the base's default, to turn off piplite's pypi.org fallback.
# See the comment inside the file for why that matters here specifically.
lite_config = "site/jupyter-lite.json"

[agent]
# `documents` and `git` are deliberately absent. They pull python-docx, python-pptx,
# pypdf, xlsxwriter and the GitHub client into a wheel set every user downloads in their
# browser, and OSW's subject is typed wiki data, not office files or repositories. Add
# them back here if that stops being true - the brief and the wheel set follow together.
#
# `validation` is absent for a harder reason: it requires jsonschema>=4.25, and the
# Python 3.13 Pyodide this flavour is pinned to ships 4.23.0 as a distribution package
# that cannot be upgraded from the site. OSW validates against the wiki's own category
# schemas through osw-python anyway, which is the thing users here actually want.
capabilities = ["tabular", "rdf"]
framing = "brief/framing.md"
closing = "brief/closing.md"
# No `skills` key on purpose. This flavour ships no bundled skills - the agent discovers
# them on the wiki at runtime, through the labextension - and the directory it used to
# name held no tracked files. git does not track empty directories, so a fresh checkout
# had no such path and Site.build() died on shutil.copytree with FileNotFoundError. It
# built here only because the empty directory happened to exist on disk. build() guards
# with `if self.skills is not None`, so omitting the key is the supported way to say
# "none". Re-add it together with actual content, never ahead of it.

[wheels]
# Fully resolved; Site._build_wheels downloads it with --no-deps. Regenerate with
# scripts/resolve_wheels.py, which also fails on a version conflict in the closure.
requirements = "piplite-requirements.txt"

[extension]
# scripts/build.sh does the npm build and the pip install itself, in the same
# container run as the site build. Site._build_extension skips the install whenever
# the bundle looks newer than src/, which in an ephemeral container means the
# extension is silently absent from the site - so it is told not to try.
path = "extension"
rebuild = "never"
